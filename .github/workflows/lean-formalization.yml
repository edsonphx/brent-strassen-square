name: Lean formalization

on:
  push:
    branches: [formalization/lean4]
    paths: ["lean/**", ".github/workflows/lean-formalization.yml"]
  pull_request:
    paths: ["lean/**", ".github/workflows/lean-formalization.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1.4.0
        with:
          lake-package-directory: lean
          auto-config: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch dependencies and check proofs
        run: |
          lake exe cache get $(sed -n '/^import Mathlib/s/^import //p' Brent/*.lean | sort -u)
          lake build
          lake env lean Audit.lean
          lake env leanchecker -v Brent
