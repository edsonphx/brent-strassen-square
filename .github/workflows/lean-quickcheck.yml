name: Lean quick check

# Error feedback for agents without a local Lean. Push to a branch named `draft/<anything>` and
# list the modules to build in `lean/QUICKCHECK` (one per line, e.g. `Brent.Groebner.Basic`).
# Mathlib comes prebuilt from its cache; only the listed modules (and the project modules they
# import) are compiled. Keep quick-check modules light: importing the kernel certificates makes
# the run take hours.

on:
  push:
    branches: ["draft/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1.4.0
        with:
          lake-package-directory: lean
          auto-config: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch prebuilt Mathlib
        run: lake exe cache get
      - name: Build the listed modules
        run: |
          test -f QUICKCHECK || { echo "::error::lean/QUICKCHECK is missing"; exit 1; }
          status=0
          while read -r module; do
            [ -z "$module" ] && continue
            case "$module" in \#*) continue;; esac
            echo "::group::lake build $module"
            if ! lake build "$module"; then
              echo "::error::$module failed to build"
              status=1
            fi
            echo "::endgroup::"
            file="${module//.//}.lean"
            if [ -f "$file" ] && grep -nE '\b(sorry|admit|native_decide)\b' "$file"; then
              echo "::error::$file contains sorry, admit or native_decide"
              status=1
            fi
          done < QUICKCHECK
          exit $status
